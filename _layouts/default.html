<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#15111f">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.tagline }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/icon.ico' | relative_url }}">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="buttons" aria-label="Main">
        <a class="btn{% if page.url == '/' %} active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
        <a class="btn{% if page.url contains '/posts/' %} active{% endif %}" href="{{ '/posts/' | relative_url }}">Posts</a>
        <a class="btn{% if page.url == '/projects/' %} active{% endif %}" href="{{ '/projects/' | relative_url }}">Projects</a>
        <a class="btn{% if page.url == '/about/' %} active{% endif %}" href="{{ '/about/' | relative_url }}">About</a>
        <a class="btn btn-ghost" href="https://github.com/{{ site.github_username }}">GitHub &#8599;</a>
      </nav>
    </div>
  </header>

  <main class="content">
{{ content }}
  </main>

  <footer class="footer">
    <div class="footer-inner">&copy; {{ site.time | date: "%Y" }} {{ site.author }} &middot; Built with Jekyll, hosted on GitHub Pages</div>
  </footer>
</body>
</html>
